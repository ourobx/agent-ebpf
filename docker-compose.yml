version: "3.8"

services:
  agent-ebpf-daemon:
    image: ghcr.io/agent-ebpf/daemon:latest
    container_name: agent_ebpf_shield
    network_mode: "host"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - BPF
      - NET_ADMIN
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - ./policy.yaml:/etc/agent-ebpf/policy.yaml:ro
    restart: always

  mcp-gateway:
    build: .
    container_name: agent_ebpf_mcp_gateway
    ports:
      - "8000:8000"
    environment:
      - POLICY_FILE=policy.yaml
    volumes:
      - ./policy.yaml:/app/policy.yaml
    restart: always

