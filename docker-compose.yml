services:
  # 1. ClickHouse — Columnar High-Throughput Time-Series Database
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: ksec-clickhouse
    restart: always
    ports:
      - "127.0.0.1:8123:8123" # HTTP API
      - "127.0.0.1:9000:9000" # Native TCP Client
    environment:
      - CLICKHOUSE_DB=ksec_telemetry
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ksec-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 2. Redis — In-Memory Token Bucket Metering & Real-Time Event Broker
  redis:
    image: redis:7.2-alpine
    container_name: ksec-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ksec-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 3. FastAPI Backend — Control Plane, gRPC Telemetry Mesh & IEP v2 Policy Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ksec/agent-ebpf-backend:2.0.0
    container_name: ksec-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # REST & SSE Control Plane
      - "127.0.0.1:50051:50051" # gRPC HTTP/2 Telemetry Mesh
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=ksec_telemetry
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ksec-production-jwt-secret-key-2026}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_live_dummy}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ksec-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 4. KSEC Web Engine & Cyberpunk UI (ksec.space)
  frontend:
    build:
      context: ./v2
      dockerfile: Dockerfile
    image: ksec/agent-ebpf-frontend:2.0.0
    container_name: ksec-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_PRESET=node-server
      - PORT=3000
      - HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - ksec-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # 5. Watchtower — Zero-Touch Continuous Deployment & Image Updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ksec-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=false
    networks:
      - ksec-net

volumes:
  clickhouse_data:
    driver: local
  redis_data:
    driver: local

networks:
  ksec-net:
    driver: bridge
    ipam:
      driver: default
