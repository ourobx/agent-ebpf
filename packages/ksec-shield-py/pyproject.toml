[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksec-shield"
version = "1.0.0"
description = "Kernel-level Zero-Trust Security SDK for AI Agents via Agent-eBPF"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Sysauto", email = "dev@sysauto.org" }
]
keywords = [
    "ebpf",
    "security",
    "ai-agent",
    "llm-security",
    "zero-trust",
    "langchain",
    "crewai",
    "ksec"
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.1.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.hatch.build.targets.wheel]
packages = ["ksec_shield"]
