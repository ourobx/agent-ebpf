kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ksec-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug
        readOnly: true
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /usr/src
        containerPath: /usr/src
        readOnly: true
  - role: worker
    image: kindest/node:v1.30.0
    extraMounts:
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug
        readOnly: true
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /usr/src
        containerPath: /usr/src
        readOnly: true
