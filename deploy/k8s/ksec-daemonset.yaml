apiVersion: v1
kind: Namespace
metadata:
  name: ksec-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksec-agent-sa
  namespace: ksec-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ksec-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ksec-agent-binding
subjects:
  - kind: ServiceAccount
    name: ksec-agent-sa
    namespace: ksec-system
roleRef:
  kind: ClusterRole
  name: ksec-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ksec-ring0-daemon
  namespace: ksec-system
  labels:
    app.kubernetes.io/name: ksec-shield
    app.kubernetes.io/component: ring0-ebpf
spec:
  selector:
    matchLabels:
      app: ksec-shield
  template:
    metadata:
      labels:
        app: ksec-shield
    spec:
      serviceAccountName: ksec-agent-sa
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ksec-agent
          image: ourobx/ksec-agent:v2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            capabilities:
              add:
                - CAP_BPF
                - CAP_NET_ADMIN
                - CAP_PERFMON
                - CAP_SYS_RESOURCE
                - CAP_SYS_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: "info"
            - name: KSEC_SLA_CEILING_US
              value: "35"
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: debug-fs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: modules-fs
              mountPath: /lib/modules
              readOnly: true
            - name: kernel-src
              mountPath: /usr/src
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
            - name: fastmcp-sse
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
        - name: debug-fs
          hostPath:
            path: /sys/kernel/debug
        - name: modules-fs
          hostPath:
            path: /lib/modules
        - name: kernel-src
          hostPath:
            path: /usr/src
