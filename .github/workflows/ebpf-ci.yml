name: Agent-eBPF Linux Kernel CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build eBPF CO-RE & Run Pytest Suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Kernel eBPF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            linux-headers-generic \
            linux-tools-generic \
            bpftool || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile cli.py tools/ebpf_loader.py mcp_server.py

      - name: Compile eBPF Bytecode
        run: |
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -c ebpf/shield.bpf.c -o ebpf/shield.bpf.o || true

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/
