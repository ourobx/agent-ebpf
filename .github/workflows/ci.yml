name: Agent-eBPF CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Lint, Compile & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Security Context & Least-Privilege Audit
        run: |
          echo "==> Verifying zero privileged: true in Helm charts..."
          ! grep -r "privileged: true" deploy/helm/ksec-shield/values.yaml
          echo "==> Verifying zero CAP_SYS_ADMIN in default Helm values..."
          ! grep -r "CAP_SYS_ADMIN" deploy/helm/ksec-shield/values.yaml

      - name: Compile All Python Modules
        run: |
          python -m compileall src tests demo

      - name: Run KSEC v2.0 Verification Suite & SLA Benchmarks
        run: |
          python tests/test_ksec_v2.py
          python tests/test_gateway_live_routes.py

      - name: Execute Proof-of-Hack (PoH) Test
        run: |
          python demo/proof_of_hack_langchain.py

      - name: Run Full Pytest Suite
        run: |
          pytest -v

  docker-build-check:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: agent-ebpf:ci-test
