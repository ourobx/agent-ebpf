name: CI/CD Pipeline - FastAPI & Next.js

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ksec-backend
  DOCKER_FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ksec-frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1. BACKEND CI: Tests & OpenAPI Schema Generation
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Tests & OpenAPI Export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/test_ksec_v2.py tests/test_saas_full_flow.py -v --disable-warnings

      - name: Export OpenAPI Schema
        run: |
          python backend/scripts/export_openapi.py

      - name: Upload OpenAPI Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: frontend/src/types/openapi.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. FRONTEND CI: Type Sync Verification, Typecheck & Next.js Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Type Sync & Next.js Build)
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OpenAPI Schema Artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: frontend/src/types

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Generate TypeScript Definitions
        run: |
          cd frontend
          npm run sync:types

      - name: Check for Type Drift (Git Diff Check)
        run: |
          # Fails if generated types differ from repo (catches uncommitted backend schema changes)
          git diff --exit-code frontend/src/types/api.d.ts || (echo "❌ ERROR: OpenAPI types are out of date! Run 'npm run sync:types' in frontend and commit the changes." && exit 1)

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ---------------------------------------------------------------------------
  # 3. DOCKER BUILD & PUSH: Automated Deployment to Docker Hub (main branch only)
  # ---------------------------------------------------------------------------
  docker-deploy:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Platform Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend Container ---
      - name: Extract Metadata for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend Container ---
      - name: Extract Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
