name: CI/CD & NPM Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/ksec-shield-ts/package-lock.json

      - name: Install Dependencies
        working-directory: packages/ksec-shield-ts
        run: npm ci

      - name: Run Unit & Integration Tests
        working-directory: packages/ksec-shield-ts
        run: npm test

      - name: Build TypeScript & Subpaths
        working-directory: packages/ksec-shield-ts
        run: npm run build

  publish:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install & Build
        working-directory: packages/ksec-shield-ts
        run: |
          npm ci
          npm run build

      - name: Publish to NPM
        working-directory: packages/ksec-shield-ts
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
