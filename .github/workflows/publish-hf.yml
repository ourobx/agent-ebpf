name: Publish to Hugging Face Hub (OIDC Trusted Publisher)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Hugging Face Repository (e.g. your-org/ksec-threat-model)'
        required: true
        default: 'ourobx/ksec-ebpf-shield'
      checkpoint_dir:
        description: 'Local directory of model / artifacts to upload'
        required: true
        default: './models'

jobs:
  publish-hf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GitHub OIDC token exchange with Hugging Face Hub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify HF CLI Version
        run: hf version

      - name: Upload Artifacts to Hugging Face Hub via OIDC
        env:
          # Scopes the short-lived token exchange to your target HF repository
          HF_OIDC_RESOURCE: ${{ github.event.inputs.hf_repo || 'ourobx/ksec-ebpf-shield' }}
        run: |
          TARGET_DIR="${{ github.event.inputs.checkpoint_dir || './models' }}"
          mkdir -p "$TARGET_DIR"
          hf upload "$HF_OIDC_RESOURCE" "$TARGET_DIR" . --commit-message "Release: KSEC v2.0 from GitHub Actions (${GITHUB_SHA::7})"
