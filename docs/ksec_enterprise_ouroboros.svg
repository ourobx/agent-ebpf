<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Enterprise Grade Precision Gradients -->
    <linearGradient id="ksecObsidianSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1714" />
      <stop offset="100%" stop-color="#060908" />
    </linearGradient>

    <!-- Primary Kinetic Beam (Laser Emerald to Mint) -->
    <linearGradient id="laserEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="40%" stop-color="#00D27F" />
      <stop offset="100%" stop-color="#008A52" />
    </linearGradient>

    <!-- Titanium Arc Gradients -->
    <linearGradient id="titaniumLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="titaniumEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E5D6C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1B242C" stop-opacity="0.2" />
    </linearGradient>

    <!-- Restrained Enterprise Ambient Occlusion -->
    <radialGradient id="enterpriseCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#00F59B" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#060908" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Sub-pixel Elevation Shadow -->
    <filter id="enterpriseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00F59B" flood-opacity="0.18" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Well -->
  <circle cx="400" cy="400" r="360" fill="url(#enterpriseCoreGlow)" />

  <!-- Outer Architectural Reticle (Precision Engineering Calibration) -->
  <g stroke="#00F59B" stroke-opacity="0.18" fill="none">
    <circle cx="400" cy="400" r="350" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="400" cy="400" r="336" stroke-width="0.75" />
    <circle cx="400" cy="400" r="214" stroke-width="0.75" stroke-opacity="0.15" />
    <circle cx="400" cy="400" r="170" stroke-width="1" stroke-dasharray="2 6" stroke-opacity="0.2" />
  </g>

  <!-- 8 Cardinal Telemetry Micro-Nodes (Sovereign Ring-0 Hooks) -->
  <g fill="#00F59B" opacity="0.4">
    <circle cx="400" cy="48" r="2.5" />
    <circle cx="648" cy="151" r="2.5" />
    <circle cx="752" cy="400" r="2.5" />
    <circle cx="648" cy="648" r="2.5" />
    <circle cx="400" cy="752" r="2.5" />
    <circle cx="151" cy="648" r="2.5" />
    <circle cx="48" cy="400" r="2.5" />
    <circle cx="151" cy="151" r="2.5" />
  </g>

  <!-- THE ENTERPRISE OUROBOROS: Continuous Parametric Kinetic Torus -->
  <g filter="url(#enterpriseShadow)">
    
    <!-- PRIMARY CHASSIS: Segmented Titanium Carapace (Interlocking Ring) -->
    <!-- Segment 1: Tail Entry & Underbelly Flow (Quadrant SW to NW) -->
    <path d="M 180 400 
             C 180 278, 278 180, 400 180 
             C 455 180, 506 200, 545 234 
             L 512 272 
             C 480 248, 442 234, 400 234 
             C 308 234, 234 308, 234 400 
             C 234 492, 308 566, 400 566 
             C 442 566, 480 552, 512 528 
             L 545 566 
             C 506 600, 455 620, 400 620 
             C 278 620, 180 522, 180 400 Z" 
          fill="url(#ksecObsidianSurface)" 
          stroke="url(#titaniumEdge)" 
          stroke-width="1.5" />

    <!-- Segment 2: Dorsal Kinetic Blade Arch (Outer Acceleration Segment) -->
    <path d="M 400 145 
             C 540 145, 655 260, 655 400 
             C 655 540, 540 655, 400 655 
             L 400 605 
             C 513 605, 605 513, 605 400 
             C 605 287, 513 195, 400 195 Z" 
          fill="#0B1310" 
          stroke="#00F59B" 
          stroke-opacity="0.25" 
          stroke-width="1" />

    <!-- Segment 3: High-Energy Laser Spine (Continuous Ring-0 Circuit Conduit) -->
    <path d="M 207 400 
             C 207 293, 293 207, 400 207 
             C 478 207, 546 253, 577 320 
             L 535 342 
             C 510 293, 459 260, 400 260 
             C 323 260, 260 323, 260 400 
             C 260 477, 323 540, 400 540 
             C 460 540, 511 506, 536 456 
             L 578 478 
             C 547 546, 479 593, 400 593 
             C 293 593, 207 507, 207 400 Z" 
          fill="url(#laserEmerald)" 
          filter="url(#subtleGlow)" 
          opacity="0.95" />

    <!-- REFINED MINIMALIST APEX HEAD & EMBEDDED INTENT-JAW (Biting the Stream) -->
    <!-- Geometric Chamfered Dragon/Serpent Head -->
    <g transform="translate(0, 0)">
      <!-- Cranial Vault (Upper Facet) -->
      <polygon points="560,310 660,350 675,395 620,400 575,365" 
               fill="#13241C" 
               stroke="#00F59B" 
               stroke-width="2" />
      
      <!-- Lower Mandible (Locking the Circuit Loop) -->
      <polygon points="560,490 660,450 675,405 620,400 575,435" 
               fill="#0A1611" 
               stroke="#00F59B" 
               stroke-width="2" />

      <!-- Optical Neural Sensor (Sovereign Kernel Eye - Clean Diamond Cut) -->
      <polygon points="618,375 632,382 622,390 610,383" 
               fill="#FFFFFF" />
      <polygon points="615,372 635,382 622,393 607,383" 
               stroke="#00F59B" 
               stroke-width="1.5" 
               fill="none" />

      <!-- Tail Fusion Core (The Infinite Convergence Point) -->
      <path d="M 675 400 L 590 400" 
            stroke="#00F59B" 
            stroke-width="5" 
            stroke-linecap="round" 
            filter="url(#subtleGlow)" />
      
      <!-- Micro Reticle Cross-Alignment (Zero-TOCTOU Precision Witness Mark) -->
      <circle cx="620" cy="400" r="14" stroke="#00F59B" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.8" />
      <circle cx="620" cy="400" r="3" fill="#00F59B" />
    </g>

    <!-- Kinetic Aerodynamic Spine Notches (Precision 8-Fold Architecture) -->
    <g stroke="#00F59B" stroke-width="1.5" opacity="0.75">
      <!-- Radial Calibration Cleats -->
      <line x1="400" y1="145" x2="400" y2="165" />
      <line x1="280" y1="175" x2="292" y2="192" />
      <line x1="190" y1="265" x2="208" y2="275" />
      <line x1="155" y1="400" x2="175" y2="400" />
      <line x1="190" y1="535" x2="208" y2="525" />
      <line x1="280" y1="625" x2="292" y2="608" />
      <line x1="400" y1="655" x2="400" y2="635" />
      <line x1="520" y1="625" x2="508" y2="608" />
    </g>

  </g>

  <!-- Clean Sub-Pixel Center Datum (Empty, Mathematical, Uncluttered) -->
  <circle cx="400" cy="400" r="75" stroke="#00F59B" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="3 9" fill="none" />
  <circle cx="400" cy="400" r="2" fill="#00F59B" opacity="0.5" />

</svg>
