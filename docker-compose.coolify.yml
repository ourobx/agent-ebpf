version: '3.8'

services:
  agent-ebpf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-ebpf-gateway
    restart: always
    network_mode: "host" # Host fiziksel NIC arayüzüne XDP hook bağlamak için gereklidir
    cap_add:
      - CAP_BPF
      - CAP_NET_ADMIN
      - CAP_PERFMON
      - CAP_SYS_RESOURCE
      - CAP_SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://agent_user:${POSTGRES_PASSWORD}@127.0.0.1:5432/agent_ebpf_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - XDP_INTERFACE=${XDP_INTERFACE:-eth0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: agent-ebpf-postgres
    restart: always
    network_mode: "host"
    environment:
      POSTGRES_DB: agent_ebpf_db
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_ebpf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-ebpf-redis
    restart: always
    network_mode: "host"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
