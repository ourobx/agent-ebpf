services:
  agent-ebpf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-ebpf-gateway
    restart: always
    cap_add:
      - CAP_BPF
      - CAP_NET_ADMIN
      - CAP_PERFMON
      - CAP_SYS_RESOURCE
    security_opt:
      - seccomp:unconfined
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - ./policy.yaml:/app/policy.yaml:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://agent_user:${POSTGRES_PASSWORD}@postgres:5432/agent_ebpf_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - XDP_INTERFACE=${XDP_INTERFACE:-eth0}
      - CORS_ORIGINS=https://ksec.space,https://staging.ksec.space,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-ebpf-net
      - coolify
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.agent-ebpf.rule=Host(`${COOLIFY_FQDN:-ksec.space}`) || Host(`staging.${COOLIFY_FQDN:-ksec.space}`)"
      - "traefik.http.routers.agent-ebpf.entrypoints=https"
      - "traefik.http.routers.agent-ebpf.tls=true"
      - "traefik.http.routers.agent-ebpf.tls.certresolver=letsencrypt"
      - "traefik.http.services.agent-ebpf.loadbalancer.server.port=8000"
      # Middleware: CORS & SSE Unbuffering
      - "traefik.http.routers.agent-ebpf.middlewares=ebpf-cors,ebpf-sse,ebpf-security-headers"
      - "traefik.http.middlewares.ebpf-cors.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.ebpf-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.ebpf-cors.headers.accesscontrolalloworiginlist=https://ksec.space,https://staging.ksec.space,http://localhost:3000"
      - "traefik.http.middlewares.ebpf-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.ebpf-sse.headers.customresponseheaders.X-Accel-Buffering=no"
      - "traefik.http.middlewares.ebpf-sse.headers.customresponseheaders.Cache-Control=no-cache"
      - "traefik.http.middlewares.ebpf-sse.headers.customresponseheaders.Connection=keep-alive"
      - "traefik.http.middlewares.ebpf-security-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.ebpf-security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.ebpf-security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.ebpf-security-headers.headers.contentTypeNosniff=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: agent-ebpf-postgres
    restart: always
    environment:
      POSTGRES_DB: agent_ebpf_db
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gateway/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agent-ebpf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_ebpf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-ebpf-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/var/lib/redis/data
    networks:
      - agent-ebpf-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  agent-ebpf-net:
    driver: bridge
  coolify:
    external: true
